[project]
name = "todo-app"
version = "0.1.0"
description = "Minimal FastAPI Todo app demonstrating a devcontainer + Postgres/pgAdmin + testcontainers + GitHub Actions -> GHCR -> Watchtower/Portainer workflow"
authors = [
    { name = "Jimmy Hedman", email = "jimmy.hedman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
